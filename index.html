    <script>
      // Gracefully prevent and ignore Vite HMR WebSocket disconnections in containerized iframe
      (function() {
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            var NativeWS = window.WebSocket;
            class ViteSafeWS extends EventTarget {
              constructor(url, protocols) {
                super();
                this.url = url;
                this.protocols = protocols;
                this.readyState = 1; // WebSocket.OPEN
                this.CONNECTING = 0;
                this.OPEN = 1;
                this.CLOSING = 2;
                this.CLOSED = 3;
                this.binaryType = 'blob';
                this.bufferedAmount = 0;
                this.extensions = '';
                this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
                this.onopen = null;
                this.onclose = null;
                this.onerror = null;
                this.onmessage = null;
                setTimeout(() => {
                  var evt = new Event('open');
                  if (typeof this.onopen === 'function') this.onopen(evt);
                  this.dispatchEvent(evt);
                }, 0);
              }
              send() {}
              close() {
                this.readyState = 3;
                var evt = new Event('close');
                if (typeof this.onclose === 'function') this.onclose(evt);
                this.dispatchEvent(evt);
              }
            }
            ViteSafeWS.CONNECTING = 0;
            ViteSafeWS.OPEN = 1;
            ViteSafeWS.CLOSING = 2;
            ViteSafeWS.CLOSED = 3;

            window.WebSocket = new Proxy(NativeWS, {
              construct: function(target, args) {
                var url = args[0];
                var protocols = args[1];
                var isVite = (typeof protocols === 'string' && protocols.indexOf('vite-') === 0) ||
                             (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite-') === 0; })) ||
                             (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));
                if (isVite) {
                  return new ViteSafeWS(url, protocols);
                }
                return new target(...args);
              }
            });
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {
          // ignore
        }

        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg && (typeof arg === 'string' || arg.message) && String(arg.message || arg).indexOf('WebSocket') !== -1) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && String(event.reason.message || event.reason).indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if ((event.message && String(event.message).indexOf('WebSocket') !== -1) || (event.error && String(event.error.message || event.error).indexOf('WebSocket') !== -1)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
