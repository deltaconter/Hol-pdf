  <!-- Stylized P Graphic -->
  <path d="M192 168h88c39.76 0 72 32.24 72 72s-32.24 72-72 72h-40v56h-48V168zm48 40v64h40c17.67 0 32-14.33 32-32s-14.33-32-32-32h-40z" fill="#ffffff" />
  
